name: PR Target Branch

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-base:
    name: Validate base branch
    runs-on: ubuntu-latest
    steps:
      - name: Check target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          if [ "${BASE_REF}" = "main" ]; then
            if [ "${HEAD_REF}" = "develop" ] && [ "${HEAD_REPO}" = "${BASE_REPO}" ]; then
              echo "Allowing release PR: develop -> main"
              exit 0
            fi
            echo "::error::PRs directly targeting 'main' are not allowed. Please change the base branch to 'develop'."
            exit 1
          fi
          echo "Base branch '${BASE_REF}' is allowed."
