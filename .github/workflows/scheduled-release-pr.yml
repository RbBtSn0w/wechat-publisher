name: Scheduled Release PR

on:
  schedule:
    # Every Friday at 15:00 Beijing time (UTC+8) -> 07:00 UTC
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: wechat-publisher-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  create-release-pr:
    name: Propose Stable Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Create or Update Promotion PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TRAIN_TOKEN }}
        run: node scripts/propose-release.mjs
