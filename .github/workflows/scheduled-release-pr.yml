name: Scheduled Release PR

on:
  schedule:
    # Every Friday at 15:00 Beijing time (UTC+8) -> 07:00 UTC
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: wechat-publisher-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  create-release-pr:
    name: Propose Stable Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Create repository App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
          skip-token-revoke: false
      - name: Create or Update Promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/propose-release.mjs
