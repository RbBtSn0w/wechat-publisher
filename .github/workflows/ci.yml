name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Use npm 12
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the cadence parser
        env:
          RELEASE_TOOLS: ${{ runner.temp }}/release-cadence
        run: npm install --prefix "$RELEASE_TOOLS" --ignore-scripts --no-audit --no-fund --save-exact yaml@2.9.1
      - name: Check the actual release contract
        id: release_contracts
        env:
          RELEASE_TOOLS: ${{ runner.temp }}/release-cadence
        run: |
          node --version
          npm --version
          node .github/release-train/sync.mjs check --consumer .
          node .github/release-train/pipeline-contract.mjs check
          node .github/release-train/cadence.mjs check
      - name: Run release regressions
        run: npm run test:release

      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Verify isolated package
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packed"
          npm run test:package -- "$RUNNER_TEMP"/packed/*.tgz
      - name: Verify CLI and Update Command
        run: |
          node dist/bin/wechat-pub.js --help
          node dist/bin/wechat-pub.js -v
          node dist/bin/wechat-pub.js -V
          node dist/bin/wechat-pub.js --version
          node dist/bin/wechat-pub.js update --help
          node dist/bin/wechat-pub.js update --dry-run
          node dist/bin/wechat-pub.js update --beta --dry-run
          node dist/bin/wechat-pub.js update --dev --dry-run
          node dist/bin/wechat-pub.js update --tag canary --dry-run
