name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify CLI and Update Command
        run: |
          node dist/bin/wechat-pub.js --help
          node dist/bin/wechat-pub.js update --help
          node dist/bin/wechat-pub.js update --dry-run
          node dist/bin/wechat-pub.js update --beta --dry-run
          node dist/bin/wechat-pub.js update --dev --dry-run
          node dist/bin/wechat-pub.js update --tag canary --dry-run
