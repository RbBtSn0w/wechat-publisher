name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Use npm 12
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Verify the Markdown dependency contract
        run: npm run check:dependencies
      - name: Install the cadence parser
        env:
          RELEASE_TOOLS: ${{ runner.temp }}/release-cadence
        run: npm install --prefix "$RELEASE_TOOLS" --ignore-scripts --no-audit --no-fund --save-exact yaml@2.9.1
      - name: Check the actual release contract
        id: release_contracts
        env:
          RELEASE_TOOLS: ${{ runner.temp }}/release-cadence
        run: |
          node --version
          npm --version
          node .github/release-train/sync.mjs check --consumer .
          node .github/release-train/pipeline-contract.mjs check
          node .github/release-train/cadence.mjs check
      - name: Run release regressions
        run: npm run test:release

      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Reject build-time dependency changes
        run: git diff --exit-code -- package.json package-lock.json
      - name: Verify isolated package
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packed"
          npm run test:package -- "$RUNNER_TEMP"/packed/*.tgz
      - name: Verify CLI and Update Command
        run: |
          node dist/bin/wechat-pub.js --help
          node dist/bin/wechat-pub.js -v
          node dist/bin/wechat-pub.js -V
          node dist/bin/wechat-pub.js --version
          node dist/bin/wechat-pub.js update --help
          node dist/bin/wechat-pub.js update --dry-run
          node dist/bin/wechat-pub.js update --beta --dry-run
          node dist/bin/wechat-pub.js update --dev --dry-run
          node dist/bin/wechat-pub.js update --tag canary --dry-run

  pr-preview:
    name: PR preview package
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: preview-source
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: preview-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: preview-tools
          sparse-checkout: |
            .github/pr-preview
            scripts
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pack and verify the exact PR head
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          preview="$RUNNER_TEMP/pr-preview"
          mkdir "$preview"
          tools="$GITHUB_WORKSPACE/preview-tools"
          ln -s "$PWD/node_modules" "$tools/node_modules"
          helper="$tools/.github/pr-preview/preview.mjs"
          node "$helper" prepare "$preview"
          npm pkg set "version=$(cat "$preview/version.txt")"
          npm run build
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
          filename="$(node -e 'const [item] = require(process.argv[1]); process.stdout.write(item.filename)' "$RUNNER_TEMP/npm-pack.json")"
          mv "$RUNNER_TEMP/$filename" "$preview/pr-preview.tgz"
          node "$helper" seal "$preview"
          PREVIEW_VERSION="$(cat "$preview/version.txt")" node "$tools/scripts/package-smoke.mjs" "$preview/pr-preview.tgz"
          node "$helper" verify "$preview"
          ARTIFACT_ID=99999999999999 node "$helper" card "$preview" > "$preview/card.md"
      - name: Upload verified preview
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Show verification commands
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: sed "s/99999999999999/$ARTIFACT_ID/g" "$RUNNER_TEMP/pr-preview/card.md" | tee -a "$GITHUB_STEP_SUMMARY"

  pr-preview-comment:
    name: Update the PR preview card
    needs: pr-preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pr-preview-card-${{ github.event.pull_request.number }}
      queue: max
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Locate the successful upload
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = Number(process.env.SOURCE_RUN_ID);
            if (!/^[1-9][0-9]*$/.test(process.env.SOURCE_RUN_ID) || !Number.isSafeInteger(run_id)) {
              throw new Error('Invalid source run ID');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
            if (run.path?.split('@', 1)[0] !== '.github/workflows/ci.yml' || run.event !== 'pull_request' ||
                !Number.isSafeInteger(run.repository?.id) || run.repository.id !== run.head_repository?.id ||
                !/^[0-9a-f]{40}$/.test(run.head_sha)) {
              throw new Error('Expected a same-repository PR CI run');
            }
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            });
            if (run.head_sha !== context.payload.pull_request.head.sha) throw new Error('Source run head differs from event');
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.sha !== run.head_sha ||
                pr.head.repo?.id !== run.repository.id || pr.base.repo?.id !== run.repository.id) {
              core.notice('This run no longer represents the live PR head.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id, filter: 'all',
            });
            const successful = jobs.filter(job =>
              job.run_id === run_id && job.name === 'PR preview package' &&
              Number.isSafeInteger(job.run_attempt) && job.run_attempt > 0 && job.run_attempt <= run.run_attempt &&
              job.conclusion === 'success' &&
              job.steps?.some(step => step.name === 'Upload verified preview' && step.conclusion === 'success'),
            );
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id,
            });
            // GitHub can roll forward an upstream job record on a downstream-only rerun.
            // The new job record has no upload of its own, so select the actual artifact.
            const attempts = [...new Set(successful.map(job => job.run_attempt))].sort((a, b) => b - a);
            for (const attempt of attempts) {
              const name = `pr-preview-${pr.number}-${run.head_sha}-attempt-${attempt}`;
              const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
              if (matches.length === 0) continue;
              if (matches.length !== 1 || successful.filter(job => job.run_attempt === attempt).length !== 1) {
                throw new Error('Ambiguous successful preview archive');
              }
              core.setOutput('pr', pr.number);
              core.setOutput('head', run.head_sha);
              core.setOutput('attempt', attempt);
              core.setOutput('artifact', matches[0].id);
              return;
            }
            throw new Error('No unexpired archive from a successful preview upload');
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.source.outputs.artifact != ''
        with:
          artifact-ids: ${{ steps.source.outputs.artifact }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/comment-preview
          merge-multiple: true
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: steps.source.outputs.artifact != ''
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          PR_HEAD: ${{ steps.source.outputs.head }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          PACKAGING_ATTEMPT: ${{ steps.source.outputs.attempt }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { createHash } = require('node:crypto');
            const { owner, repo } = context.repo;
            const { PR_NUMBER, PR_HEAD, ARTIFACT_ID, PACKAGING_ATTEMPT, SOURCE_RUN_ID } = process.env;
            const issue_number = Number(PR_NUMBER);
            const marker = '<!-- pr-installable-preview -->';
            const publishedMarker = '<!-- verified-registry-preview:' + PR_HEAD + ' -->';
            const directory = path.join(process.env.RUNNER_TEMP, 'comment-preview');
            const receipt = JSON.parse(fs.readFileSync(path.join(directory, 'receipt.json'), 'utf8'));
            if (receipt.pr !== PR_NUMBER || receipt.head !== PR_HEAD ||
                receipt.runId !== SOURCE_RUN_ID || receipt.attempt !== PACKAGING_ATTEMPT ||
                receipt.name !== '@rbbtsn0w/wechat-publisher' ||
                !/^[0-9]+\.[0-9]+\.[0-9]+-dev\.pr[1-9][0-9]*\.[a-z0-9]+$/.test(receipt.version)) {
              throw new Error('Downloaded receipt does not match the verified PR package');
            }
            const bytes = fs.readFileSync(path.join(directory, 'pr-preview.tgz'));
            if (createHash('sha256').update(bytes).digest('hex') !== receipt.sha256) {
              throw new Error('Downloaded PR package checksum does not match');
            }
            const archiveMarker = '<!-- pr-preview-artifact -->';
            const panel = fs.readFileSync(path.join(directory, 'card.md'), 'utf8')
              .replaceAll('99999999999999', ARTIFACT_ID);
            if (!panel.startsWith(archiveMarker + '\n')) throw new Error('Preview archive panel is missing');
            let body = marker + '\n' + panel;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker + '\n'));
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.sha !== PR_HEAD ||
                pr.head.repo?.id !== pr.base.repo?.id) {
              core.notice('The PR head changed before the card could be written.');
              return;
            }
            if (existing?.body.includes(publishedMarker)) {
              const boundary = existing.body.indexOf('\n' + archiveMarker);
              if (boundary < 0) return;
              body = existing.body.slice(0, boundary) + '\n' + panel;
            }
            if (existing?.body === body) return;
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
