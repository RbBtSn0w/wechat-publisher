name: Sync main to develop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    name: Sync main back to develop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge main into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout -B develop origin/develop
          if [ "$(git rev-list --count develop..origin/main)" -gt 0 ]; then
            echo "Syncing main back into develop..."
            git merge --no-ff origin/main --no-edit -m "chore(repo): sync main to develop [skip ci]"
            git push origin develop
          else
            echo "develop is already up to date with main."
          fi
