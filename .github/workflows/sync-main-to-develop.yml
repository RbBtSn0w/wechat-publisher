name: Sync main to develop

on:
  push:
    branches: [main]
  delete:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every five minutes in Beijing time (UTC+8); minute cadence is identical in UTC.
    - cron: '*/5 * * * *'

concurrency:
  group: wechat-publisher-lifecycle
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  sync:
    name: Reconcile release lifecycle
    if: vars.RELEASE_TRAIN_ENABLED == 'true'
    runs-on: [self-hosted, release-train-wechat-publisher]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconcile trusted lifecycle policy
        env:
          RELEASE_TRAIN_TOKEN: ${{ secrets.RELEASE_TRAIN_TOKEN }}
          RELEASE_TRAIN_POLICY_PATH: ${{ vars.RELEASE_TRAIN_POLICY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TRAIN_TOKEN" ]; then
            echo '::error::RELEASE_TRAIN_TOKEN is required.'
            exit 1
          fi
          export GH_TOKEN="$RELEASE_TRAIN_TOKEN"
          python3 - <<'PY'
          import os
          from pathlib import Path
          policy = Path(os.environ['RELEASE_TRAIN_POLICY_PATH'])
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          if not policy.is_absolute() or not policy.is_file() or policy.resolve().is_relative_to(workspace):
              raise SystemExit('Policy must be an existing absolute path outside the checkout.')
          PY
          python3 scripts/release_train_lifecycle.py --config "$RELEASE_TRAIN_POLICY_PATH" --apply reconcile --event-file "$GITHUB_EVENT_PATH"
