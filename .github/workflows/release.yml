name: Release

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and Test
        run: |
          npm run lint
          npm run test

      - name: Build
        run: npm run build

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --yes semantic-release@25

      - name: Dual Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          publish_log="$(mktemp)"
          cleanup() { rm -f .npmrc "$publish_log"; }
          trap cleanup EXIT
          OWNER_LOWER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "@${OWNER_LOWER}:registry=https://npm.pkg.github.com"
            echo '//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}'
          } > .npmrc
          npm publish --registry https://npm.pkg.github.com 2> "$publish_log" || {
            echo "GitHub Packages: Version already exists or nothing to publish."
            cat "$publish_log" >&2
          }
