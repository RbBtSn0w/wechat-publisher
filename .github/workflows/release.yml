name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Job 1: PR 阶段发布 Dev / Canary 预览版并评论指引
  # -------------------------------------------------------------
  pr-dev-release:
    name: PR Dev Preview Release
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and Test
        run: |
          npm run lint
          npm run test

      - name: Build
        run: npm run build

      - name: Prepare Dev Version
        id: versioning
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BASE_VERSION="$(node -p "require('./package.json').version")"
          DEV_VERSION="${BASE_VERSION}-dev.pr${PR_NUM}.${SHORT_SHA}"
          npm version "${DEV_VERSION}" --no-git-tag-version --allow-same-version
          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (next dist-tag)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            npm publish --tag next --access public
            echo "Successfully published ${DEV_VERSION} to npm with tag 'next'"
          else
            echo "::warning::NPM_TOKEN is not set. Skipping npm publish."
          fi

      - name: Dual Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@rbbtsn0w:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          npm publish --registry https://npm.pkg.github.com || echo "GitHub Packages: Version already exists or publish skipped."

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const devVersion = '${{ steps.versioning.outputs.dev_version }}';
            const body = `### 🚀 PR Dev Preview Released

            A development build for this PR has been compiled and published!

            - **Version**: \`${devVersion}\`
            - **Dist-tag**: \`next\`

            #### 📦 How to Test

            \`\`\`bash
            # Upgrade using wechat-pub update:
            wechat-pub update --dev

            # Or install exact version globally:
            npm install -g @rbbtsn0w/wechat-publisher@${devVersion}
            \`\`\`
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('PR Dev Preview Released')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # -------------------------------------------------------------
  # Job 2: Main 分支合并后执行正式版发版 (Semantic Release + OIDC)
  # -------------------------------------------------------------
  official-release:
    name: Official Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and Test
        run: |
          npm run lint
          npm run test

      - name: Build
        run: npm run build

      - name: Semantic Release (npm OIDC + GitHub Release)
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release@25

      - name: Dual Publish to GitHub Packages
        run: |
          echo "@rbbtsn0w:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          npm publish --registry https://npm.pkg.github.com || echo "GitHub Packages: Version already exists or nothing to publish."
