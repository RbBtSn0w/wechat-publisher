name: Release

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: wechat-publisher-lifecycle
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint and Test
        run: |
          npm run lint
          npm test
      - name: Build and verify package
        run: |
          npm run build
          npm run test:package
      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release.mjs
      - name: Mirror to GitHub Packages
        if: steps.semantic.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.semantic.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.semantic.outputs.channel }}
          RELEASE_GIT_HEAD: ${{ steps.semantic.outputs.git_head }}
        run: node scripts/publish-mirror.mjs "$RELEASE_VERSION" "$RELEASE_CHANNEL" "$RELEASE_GIT_HEAD"
