name: Release

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and Test
        run: |
          npm run lint
          npm run test

      - name: Build
        run: npm run build

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --yes semantic-release@25

      - name: Dual Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          publish_log="$(mktemp)"
          cleanup() { rm -f .npmrc "$publish_log"; }
          trap cleanup EXIT
          OWNER_LOWER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "@${OWNER_LOWER}:registry=https://npm.pkg.github.com"
            echo '//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}'
          } > .npmrc
          npm publish --registry https://npm.pkg.github.com 2> "$publish_log" || {
            echo "GitHub Packages: Version already exists or nothing to publish."
            cat "$publish_log" >&2
          }

      - name: Sync main to develop
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout -B develop origin/develop
          if [ "$(git rev-list --count develop..origin/main)" -gt 0 ]; then
            echo "Syncing main back into develop..."
            git merge --no-ff origin/main --no-edit -m "chore(repo): sync main to develop [skip ci]"
            git push origin develop
          else
            echo "develop is already up to date with main."
          fi
